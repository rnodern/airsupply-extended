name: Staging ARM64 image

# Development branches publish separate ARM64 tags for hardware trials.
on:
  push:
    branches:
      - feature/airmini-history
      - feature/multi-machine
    paths:
      - "airsupply/**"
      - ".github/workflows/staging-image.yml"

permissions:
  contents: read

concurrency:
  group: staging-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run synthetic tests and upstream suite
        working-directory: airsupply
        env:
          PYTHONPATH: src
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v

  publish-arm64:
    needs: tests
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish staging ARM64 container
        uses: docker/build-push-action@v6
        with:
          context: airsupply
          platforms: linux/arm64
          push: true
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/aarch64-base:3.21
            BUILD_VERSION=dev-${{ github.sha }}
          tags: ghcr.io/rnodern/airsupply-extended:${{ github.ref_name == 'feature/multi-machine' && 'multi-machine-arm64' || 'staging-arm64' }}
