name: CI

# Builds the image without pushing it. The Dockerfile carries its own checks:
# libairmini's tests run under ctest, the .so has to load against the image's
# libcrypto, and the Python has to compile and import.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: pip install -r requirements.txt
        working-directory: airsupply

      # The image build runs these too, but only against what ships in it.
      # Here the Elm source is present, so the check that the page's decoders
      # still match the state the add-on sends actually runs rather than
      # skipping itself.
      - run: python3 -m unittest discover -s tests -v
        working-directory: airsupply
        env:
          PYTHONPATH: src

  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check card/airsupply-card.js
      - run: node card/test.mjs
      - run: node card/owner.test.mjs
      - run: node card/dashboard.test.mjs

  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            base: ghcr.io/home-assistant/amd64-base:3.21
          - arch: arm64
            runner: ubuntu-24.04-arm
            base: ghcr.io/home-assistant/aarch64-base:3.21
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: airsupply
          push: false
          build-args: |
            BUILD_FROM=${{ matrix.base }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
